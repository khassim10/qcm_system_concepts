<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#1b1f24;--mut:#667085;--bd:#d9dde3;--ok:#16a34a;--okbg:#dcfce7;--ko:#dc2626;--kobg:#fee2e2;--acc:#2563eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--txt:#e8eaed;--mut:#9aa3b2;--bd:#2c313a;--okbg:#12361f;--kobg:#431616;--acc:#60a5fa}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0 0 4px}
.sub{color:var(--mut);font-size:.9rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
select,button,input[type=file]{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--txt);padding:10px 14px;border-radius:10px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.02rem;margin:0 0 12px}
.opt{display:flex;gap:10px;width:100%;text-align:left;margin:8px 0;padding:12px;align-items:flex-start}
.opt b{min-width:1.4em}
.opt.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.ko{background:var(--kobg);border-color:var(--ko)}
.expl{margin-top:12px;padding:12px;border-left:4px solid var(--acc);background:var(--bg);border-radius:8px;font-size:.95rem}
.verdict{font-weight:600;margin-top:10px}
.verdict.ok{color:var(--ok)}.verdict.ko{color:var(--ko)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:10px;padding:8px}
.stats b{display:block;font-size:1.2rem}
small{color:var(--mut)}
.warn{font-size:.85rem;background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:14px;color:var(--mut)}
.expl.doubt{border-left-color:#d97706}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>IT 373 · Systems Concepts – QCM</h1>
  <div class="sub" id="sub"></div>
  <div class="warn">Corrigé rédigé par Claude, sans corrigé officiel : à recouper avec ton cours. Les réponses marquées ⚠ sont celles où il y a un doute.</div>

  <div class="card" id="setup">
    <label for="mod">Semaine</label>
    <select id="mod"></select>
    <label for="mode">Mode</label>
    <select id="mode">
      <option value="smart">Intelligent (les questions ratées reviennent plus souvent)</option>
      <option value="new">Seulement les questions jamais vues</option>
      <option value="wrong">Seulement mes erreurs</option>
      <option value="all">Toutes, dans l’ordre</option>
    </select>
    <div class="row" style="margin-top:14px">
      <button class="primary" id="start">Commencer</button>
      <button id="reset">Réinitialiser ma progression</button>
    </div>
    <button class="primary hide" id="install" style="margin-top:10px;width:100%">Installer l’appli sur cet appareil</button>
    <label for="imp" style="margin-top:16px">Importer un corrigé (fichier JSON)</label>
    <input type="file" id="imp" accept=".json,application/json">
    <small id="impmsg"></small>
  </div>

  <div class="card" id="progress">
    <div class="stats">
      <div><b id="sSeen">0</b><small>vues</small></div>
      <div><b id="sOk">0</b><small>maîtrisées</small></div>
      <div><b id="sKo">0</b><small>à revoir</small></div>
    </div>
    <div class="bar" style="margin-top:10px"><i id="barfill" style="width:0"></i></div>
  </div>

  <div class="card hide" id="quiz">
    <div class="meta"><span id="qmeta"></span><span id="qcount"></span></div>
    <p class="q" id="qtext"></p>
    <div id="opts"></div>
    <button class="primary hide" id="validate">Valider</button>
    <div id="result"></div>
    <div class="row" style="margin-top:14px">
      <button id="stop">Terminer</button>
      <button class="primary" id="next" disabled>Suivante</button>
    </div>
  </div>
</div>

<script>
const DATA = {"modules": [{"id": 1, "titre": "Introduction aux systèmes d’exploitation et à la gestion des ressources"}, {"id": 2, "titre": "Gestion des processus et de la mémoire"}, {"id": 3, "titre": "Systèmes de fichiers et gestion des partitions"}, {"id": 4, "titre": "Installation et configuration des serveurs web"}], "questions": [{"id": 1, "num": 1, "module": 1, "section": "Fondements et composants", "question": "Parmi les éléments suivants, lesquels sont des systèmes d’exploitation ?", "choix": {"A": "Un logiciel de traitement de texte.", "B": "Un navigateur Internet.", "C": "Un compilateur de langage C.", "D": "Un logiciel de présentation.", "E": "Un gestionnaire de bases de données.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 2, "num": 2, "module": 1, "section": "Fondements et composants", "question": "Quelles fonctions relèvent directement d’un système d’exploitation ?", "choix": {"A": "Déterminer la pertinence scientifique d’un rapport.", "B": "Organiser l’utilisation du processeur.", "C": "Corriger automatiquement les erreurs de raisonnement d’un programme.", "D": "Attribuer de la mémoire aux applications.", "E": "Coordonner les échanges avec les périphériques.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 3, "num": 3, "module": 1, "section": "Fondements et composants", "question": "Un étudiant affirme qu’un système d’exploitation peut réaliser les opérations suivantes. Lesquelles sont effectivement possibles ?", "choix": {"A": "Augmenter physiquement la capacité de la RAM par un réglage logiciel.", "B": "Transformer un écran ordinaire en processeur supplémentaire.", "C": "Garantir l’absence de panne matérielle.", "D": "Exécuter toute application indépendamment de sa compatibilité.", "E": "Conserver définitivement dans la RAM ordinaire des données sans alimentation.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 4, "num": 4, "module": 1, "section": "Fondements et composants", "question": "Quelles associations entre composant et fonction sont correctes ?", "choix": {"A": "Processeur — conservation permanente des fichiers personnels.", "B": "Mémoire vive — impression des documents.", "C": "Processeur — exécution des instructions.", "D": "Mémoire vive — conservation temporaire de données utilisées.", "E": "Stockage — conservation des fichiers après extinction.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 5, "num": 5, "module": 1, "section": "Fondements et composants", "question": "Quelles affirmations distinguent correctement le système d’exploitation d’une application ?", "choix": {"A": "Le système fournit des services communs utilisés par les applications.", "B": "Une application répond généralement à un besoin particulier de l’utilisateur.", "C": "Chaque application remplace nécessairement le système d’exploitation.", "D": "Le système d’exploitation est uniquement un logiciel de traitement de texte.", "E": "Une application ne consomme aucune ressource matérielle.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 6, "num": 6, "module": 1, "section": "Fondements et composants", "question": "Quel élément exécute principalement les instructions d’un programme ?", "choix": {"A": "Le système de fichiers.", "B": "Le clavier.", "C": "Le moniteur.", "D": "Le support de sauvegarde.", "E": "Le processeur.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 7, "num": 7, "module": 1, "section": "Fondements et composants", "question": "Quel énoncé décrit le mieux le rôle de la mémoire vive ?", "choix": {"A": "Conserver exclusivement les documents archivés.", "B": "Accueillir temporairement des instructions et des données utilisées pendant l’exécution.", "C": "Remplacer les périphériques d’entrée.", "D": "Définir seule la vitesse de tous les traitements.", "E": "Protéger physiquement l’ordinateur contre les coupures électriques.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 8, "num": 8, "module": 1, "section": "Fondements et composants", "question": "Quelles affirmations sur la RAM et le stockage sont correctes ?", "choix": {"A": "Un SSD peut conserver des fichiers après l’arrêt de l’ordinateur.", "B": "La RAM ordinaire conserve ses données sans alimentation.", "C": "Le stockage et la RAM remplissent exactement la même fonction.", "D": "Un espace de stockage libre garantit une RAM disponible suffisante.", "E": "Une application peut utiliser simultanément la RAM et le stockage.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 9, "num": 9, "module": 1, "section": "Fondements et composants", "question": "Quel énoncé définit le mieux un périphérique ?", "choix": {"A": "Une instruction appartenant à un programme.", "B": "Une politique d’attribution de la mémoire.", "C": "Un ensemble de fichiers d’un même dossier.", "D": "Un équipement assurant notamment une fonction d’entrée, de sortie ou de stockage.", "E": "Un composant logiciel chargé d’organiser les répertoires.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 10, "num": 10, "module": 1, "section": "Fondements et composants", "question": "Quelles associations sont correctes ?", "choix": {"A": "Clavier — périphérique de sortie uniquement.", "B": "Écran ordinaire non tactile — périphérique d’entrée uniquement.", "C": "Imprimante simple — périphérique d’entrée uniquement.", "D": "Scanner — périphérique de sortie uniquement.", "E": "Microphone — périphérique de sortie audio.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 11, "num": 11, "module": 1, "section": "Fondements et composants", "question": "Quelles associations sont correctes ?", "choix": {"A": "Clavier — saisie de caractères.", "B": "Écran — affichage d’informations.", "C": "Scanner — numérisation de documents.", "D": "Imprimante — exécution des instructions du processeur.", "E": "Souris — conservation permanente des fichiers.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 12, "num": 12, "module": 1, "section": "Fondements et composants", "question": "Quel est le rôle principal d’un pilote de périphérique ?", "choix": {"A": "Remplacer le matériel absent.", "B": "Convertir toutes les applications en systèmes d’exploitation.", "C": "Augmenter physiquement la mémoire du périphérique.", "D": "Garantir le fonctionnement d’un appareil débranché.", "E": "Permettre au système de communiquer avec un matériel particulier.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 13, "num": 13, "module": 1, "section": "Fondements et composants", "question": "Quel composant correspond au cœur du système d’exploitation ?", "choix": {"A": "Le navigateur.", "B": "Le bureau graphique.", "C": "Le dossier personnel.", "D": "Le noyau.", "E": "Le tableur.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 14, "num": 14, "module": 1, "section": "Fondements et composants", "question": "Quelles affirmations sur une interface graphique et une interface en ligne de commande sont correctes ?", "choix": {"A": "Une interface graphique constitue à elle seule tout le système.", "B": "Une interface graphique permet notamment d’utiliser des fenêtres et des icônes.", "C": "Une interface en ligne de commande permet d’exprimer des demandes sous forme textuelle.", "D": "Une interface en ligne de commande remplace physiquement le processeur.", "E": "Une interface graphique dispense le système de gérer la mémoire.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 15, "num": 15, "module": 1, "section": "Fondements et composants", "question": "Quelles affirmations sur les interfaces utilisateur sont correctes ?", "choix": {"A": "Un même système peut proposer plusieurs interfaces.", "B": "Une interface textuelle implique nécessairement l’absence de système d’exploitation.", "C": "Le changement de fond d’écran modifie l’architecture du noyau.", "D": "L’interface permet à l’utilisateur de demander certaines opérations au système.", "E": "Une interface graphique rend inutile la gestion des périphériques.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 16, "num": 16, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Un étudiant ouvre un navigateur et un traitement de texte. Quelles ressources peuvent être mobilisées par les deux applications ?", "choix": {"A": "Uniquement le clavier, à l’exclusion de toute autre ressource.", "B": "Exclusivement le stockage, sans utilisation de mémoire vive.", "C": "Le processeur pour exécuter leurs instructions.", "D": "Une quantité illimitée de mémoire indépendante du matériel.", "E": "La mémoire vive pour leurs données de travail.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 17, "num": 17, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Pourquoi le système doit-il organiser l’accès aux ressources ?", "choix": {"A": "Parce que chaque application possède nécessairement un ordinateur distinct.", "B": "Parce que les ressources matérielles sont toujours illimitées.", "C": "Parce que les applications ne sollicitent jamais les mêmes ressources.", "D": "Parce que plusieurs demandes peuvent concerner des ressources limitées.", "E": "Parce que le matériel n’intervient pas dans l’exécution des programmes.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 18, "num": 18, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Dans un laboratoire, plusieurs étudiants envoient des documents à une même imprimante. Quelles observations sont cohérentes ?", "choix": {"A": "Chaque document exige une imprimante physique distincte.", "B": "Le premier document devient automatiquement prioritaire pour toujours.", "C": "Les travaux peuvent être organisés dans une file d’attente.", "D": "L’imprimante doit imprimer simultanément toutes les pages reçues.", "E": "Un travail peut attendre pendant qu’un autre utilise l’imprimante.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 19, "num": 19, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Un ordinateur possède beaucoup d’espace libre sur son SSD, mais peu de RAM disponible. Quelles conclusions sont correctes ?", "choix": {"A": "La capacité de stockage libre ne représente pas la RAM disponible.", "B": "Il faut distinguer les besoins en stockage des besoins en mémoire vive.", "C": "L’ordinateur dispose nécessairement d’une mémoire vive illimitée.", "D": "Le SSD libre prouve que toutes les applications peuvent être lancées.", "E": "Le processeur ne peut plus exécuter aucune instruction.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 20, "num": 20, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Une application effectue un calcul long sans lire de nouveau fichier. Quelles affirmations sont correctes ?", "choix": {"A": "Le stockage devient nécessairement la ressource la plus sollicitée.", "B": "L’absence de lecture de fichier signifie l’absence de calcul.", "C": "Le processeur peut être fortement sollicité.", "D": "Les données du calcul peuvent rester en mémoire vive.", "E": "Le système cesse obligatoirement de gérer les autres applications.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 21, "num": 21, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Un étudiant affirme : « Une machine lente manque toujours de RAM. » Quelle réponse est la plus rigoureuse ?", "choix": {"A": "Cette affirmation est toujours vraie.", "B": "Il faut observer les ressources, car plusieurs causes peuvent expliquer la lenteur.", "C": "Une lenteur provient exclusivement du clavier.", "D": "Le système d’exploitation n’intervient jamais dans les performances.", "E": "La quantité de RAM permet à elle seule de déterminer toutes les performances.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 22, "num": 22, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Une application lit un document enregistré sur un SSD. Quels éléments peuvent participer à cette opération ?", "choix": {"A": "Le système de fichiers pour retrouver et organiser les données.", "B": "L’imprimante pour rendre obligatoirement le fichier accessible.", "C": "La mémoire vive pour accueillir les données utilisées.", "D": "Le processeur pour exécuter les instructions de lecture et de traitement.", "E": "Le scanner pour reconstruire le fichier à chaque ouverture.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 23, "num": 23, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Deux applications réclament le processeur. Quelle fonction générale du système répond à cette situation ?", "choix": {"A": "La modification de l’extension des fichiers.", "B": "Le réglage de la résolution d’écran.", "C": "Le changement de langue du clavier.", "D": "La création d’un raccourci.", "E": "L’organisation de l’accès au temps processeur.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 24, "num": 24, "module": 1, "section": "Gestion des ressources et études de cas", "question": "Un périphérique est branché, mais il n’est pas utilisable dans le système. Quelles vérifications sont pertinentes ?", "choix": {"A": "Vérifier sa connexion et son alimentation éventuelle.", "B": "Vérifier sa reconnaissance par le système et la présence d’un pilote adapté.", "C": "Supprimer systématiquement tous les documents de l’utilisateur.", "D": "Remplacer le processeur avant toute observation.", "E": "Conclure immédiatement que la RAM est défectueuse.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 25, "num": 25, "module":  et sécurisation de base", "question": "Quelles pratiques réduisent l’exposition inutile du serveur ?", "choix": {"A": "Retirer du répertoire public les copies de configuration et fichiers sensibles.", "B": "Accorder le contrôle total au compte web sur tout le disque.", "C": "Ne publier que les ressources nécessaires au site.", "D": "Placer tous les documents personnels dans DocumentRoot.", "E": "Rendre les fichiers de mots de passe téléchargeables.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 227, "num": 47, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quelles affirmations sur les permissions du compte exécutant Apache sont correctes ?", "choix": {"A": "Il doit toujours disposer du contrôle total sur tous les disques.", "B": "Il ne doit pas recevoir des droits d’écriture inutiles sur tout le site.", "C": "Il n’a besoin d’aucun droit pour lire les fichiers.", "D": "Il doit appartenir au groupe de tous les utilisateurs.", "E": "Il doit pouvoir lire les fichiers que le serveur doit publier.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 228, "num": 48, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quelles précautions sont pertinentes lors de l’installation d’Apache ?", "choix": {"A": "Utiliser une source de distribution fiable.", "B": "Installer un paquet trouvé au hasard sans vérification.", "C": "Prévoir le maintien à jour du logiciel.", "D": "Consulter la documentation adaptée à l’environnement.", "E": "Désactiver les mises à jour pour toute la durée de vie du serveur.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 229, "num": 49, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Dans Apache 2.4, quelles affirmations sur Require sont correctes ?", "choix": {"A": "Require all denied démarre le service.", "B": "Require all denied peut interdire l’accès dans le contexte où la règle s’applique.", "C": "Require remplace les permissions du système de fichiers dans tous les cas.", "D": "Require all granted crée un nom de domaine.", "E": "Require all granted peut autoriser l’accès au niveau d’Apache dans le contexte où la règle s’applique.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 230, "num": 50, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Une règle Apache autorise l’accès, mais le compte du service ne peut pas lire le fichier sur le disque. Quelles conclusions sont correctes ?", "choix": {"A": "La simple présence de ServerName garantit la lecture.", "B": "Le fichier devient automatiquement lisible par tous.", "C": "Les droits du compte de service doivent aussi être examinés.", "D": "L’autorisation Apache ne remplace pas les permissions du système.", "E": "Le navigateur contourne nécessairement le refus du système.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 231, "num": 51, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Pour un dossier public, quelles affirmations sur Options -Indexes sont correctes ?", "choix": {"A": "Elle n’interdit pas, à elle seule, l’accès à tout fichier dont l’URL est connue.", "B": "Elle peut éviter l’affichage automatique de la liste des fichiers en l’absence d’index approprié.", "C": "Elle supprime tous les fichiers du dossier.", "D": "Elle chiffre automatiquement les communications.", "E": "La directive retire l’option d’indexation automatique du répertoire dans le contexte applicable.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 232, "num": 52, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Une page d’accueil s’affiche correctement. Quelles conclusions restent raisonnables ?", "choix": {"A": "Le serveur ne nécessite plus aucune maintenance.", "B": "Tous les sites sont nécessairement configurés correctement.", "C": "Ce test confirme le fonctionnement de cette requête dans les conditions observées.", "D": "Les autres hôtes et règles d’accès nécessitent leurs propres vérifications.", "E": "Aucun fichier sensible ne peut être accessible.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 233, "num": 53, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Pourquoi faut-il éviter de laisser des sauvegardes de configuration dans DocumentRoot ?", "choix": {"A": "Elles peuvent devenir téléchargeables si elles sont servies comme des fichiers ordinaires.", "B": "Leur présence bloque nécessairement toutes les pages.", "C": "Elles accélèrent systématiquement le serveur.", "D": "Elles remplacent les journaux d’erreur.", "E": "Elles peuvent contenir des informations qui ne doivent pas être publiées.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 234, "num": 54, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Après avoir limité l’accès à un dossier sensible, quelles vérifications sont pertinentes ?", "choix": {"A": "Supposer que le nom secret du dossier suffit.", "B": "Tester une requête qui doit être refusée.", "C": "Tester uniquement l’ouverture locale du fichier dans un éditeur.", "D": "Vérifier que les ressources publiques nécessaires restent accessibles.", "E": "Déduire la protection de la couleur de son icône.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 235, "num": 55, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quelle affirmation décrit le mieux le rôle d’un pare-feu dans l’accès au serveur web ?", "choix": {"A": "Il peut autoriser ou bloquer le trafic vers le port utilisé par Apache.", "B": "Il corrige les erreurs de syntaxe Apache.", "C": "Il remplace les permissions des dossiers.", "D": "Il choisit automatiquement le DocumentRoot.", "E": "Il crée toutes les pages HTML.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 236, "num": 56, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quelles pratiques conviennent pour un TP Apache sur une machine partagée ?", "choix": {"A": "Publier tous les répertoires du système.", "B": "Désactiver sans limite tous les services de sécurité.", "C": "Modifier les autres sites sans vérifier leur rôle.", "D": "Conserver les paramètres utiles pour rétablir l’état initial.", "E": "Limiter les changements au périmètre prévu.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 237, "num": 57, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Un étudiant veut tester une page HTML servie par Apache. Quelle action constitue un test HTTP ?", "choix": {"A": "Ouvrir son URL http://... dans un navigateur.", "B": "Copier le fichier sur une clé USB.", "C": "Lire son code dans un éditeur.", "D": "Renommer le fichier en .html.", "E": "Ouvrir uniquement le fichier avec file://... .", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 238, "num": 58, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Dans une configuration simple, DirectoryIndex vaut accueil.html. Une requête vise / et le fichier accueil.html existe dans DocumentRoot. Quelle ressource est normalement recherchée comme index ?", "choix": {"A": "access.log.", "B": "httpd.conf.", "C": "hosts.", "D": "error.log.", "E": "accueil.html.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 239, "num": 59, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quel résultat valide le mieux un TP comportant deux hôtes virtuels ?", "choix": {"A": "Le navigateur contient deux favoris portant des noms différents.", "B": "Une seule page fonctionne par adresse IP sans test des noms.", "C": "Apache est téléchargé sans être démarré.", "D": "Chaque nom prévu affiche son contenu propre et les accès sont testés conformément aux règles attendues.", "E": "Les dossiers existent, mais aucune requête n’est envoyée.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}, {"id": 240, "num": 60, "module": 4, "section": "Diagnostic et sécurisation de base", "question": "Quelles conclusions résument une configuration Apache cohérente ?", "choix": {"A": "L’écoute, les noms d’hôtes et les répertoires publiés doivent être cohérents.", "B": "Créer un VirtualHost suffit à configurer tous les clients.", "C": "Une page accessible garantit l’absence de toute exposition sensible.", "D": "Le serveur n’a plus besoin de mises à jour après le premier test.", "E": "La validation syntaxique doit être complétée par des tests HTTP et d’accès.", "F": "Aucune de ces propositions n’est correcte."}, "multi": true}]};
const ANSWERS_BUILTIN = {"1": {"r": "F", "e": "Aucune proposition n’est un système d’exploitation : traitement de texte, navigateur, compilateur, logiciel de présentation et SGBD sont des applications ou outils qui s’exécutent au-dessus du système."}, "2": {"r": "BDE", "e": "Le système gère le processeur, la mémoire et les échanges avec les périphériques. Juger la pertinence d’un rapport ou corriger un raisonnement n’est pas son rôle."}, "3": {"r": "F", "e": "Un OS ne peut ni augmenter physiquement la RAM, ni transformer un écran en processeur, ni garantir l’absence de panne, ni exécuter une application incompatible. La RAM ordinaire perd ses données sans alimentation."}, "4": {"r": "CDE", "e": "Le processeur exécute les instructions, la RAM conserve temporairement les données, le stockage garde les fichiers après extinction."}, "5": {"r": "AB", "e": "Le système fournit les services communs, l’application répond à un besoin précis. Une application ne remplace pas le système et consomme toujours des ressources."}, "6": {"r": "E", "e": "Le processeur exécute les instructions d’un programme."}, "7": {"r": "B", "e": "La mémoire vive accueille temporairement instructions et données pendant l’exécution."}, "8": {"r": "AE", "e": "Un SSD conserve ses fichiers hors tension et une application utilise à la fois RAM et stockage. La RAM ordinaire est volatile et ne remplit pas le même rôle que le stockage."}, "9": {"r": "D", "e": "Un périphérique est un équipement d’entrée, de sortie ou de stockage."}, "10": {"r": "F", "e": "Le clavier est un périphérique d’entrée, l’écran un périphérique de sortie, l’imprimante de sortie, le scanner d’entrée, le microphone d’entrée : aucune association proposée n’est correcte."}, "11": {"r": "ABC", "e": "Clavier : saisie, écran : affichage, scanner : numérisation. L’imprimante n’exécute pas les instructions du processeur et la souris ne conserve pas de fichiers."}, "12": {"r": "E", "e": "Le pilote permet au système de communiquer avec un matériel particulier."}, "13": {"r": "D", "e": "Le noyau est le cœur du système d’exploitation."}, "14": {"r": "BC", "e": "L’interface graphique utilise fenêtres et icônes, la ligne de commande exprime les demandes en texte. Aucune des deux n’est le système entier."}, "15": {"r": "AD", "e": "Un système peut proposer plusieurs interfaces, qui permettent de demander des opérations au système. Une interface textuelle n’exclut pas le système et le fond d’écran ne change pas le noyau."}, "16": {"r": "CE", "e": "Deux applications ouvertes utilisent le processeur et la mémoire vive. Les ressources ne se limitent pas au clavier ni au stockage, et la mémoire n’est pas illimitée."}, "17": {"r": "D", "e": "Plusieurs demandes peuvent viser des ressources limitées, d’où la nécessité d’organiser l’accès."}, "18": {"r": "CE", "e": "Les travaux d’impression sont organisés dans une file d’attente : l’un attend pendant qu’un autre utilise l’imprimante."}, "19": {"r": "AB", "e": "L’espace libre du SSD n’est pas de la RAM disponible : il faut distinguer stockage et mémoire vive."}, "20": {"r": "CD", "e": "Un calcul long sollicite surtout le processeur, avec des données qui peuvent rester en mémoire vive."}, "21": {"r": "B", "e": "Plusieurs causes peuvent expliquer la lenteur (processeur, mémoire, stockage…) : il faut observer les ressources avant de conclure."}, "22": {"r": "ACD", "e": "Lecture d’un fichier : le système de fichiers retrouve les données, la RAM les accueille et le processeur exécute les instructions. Ni imprimante ni scanner."}, "23": {"r": "E", "e": "Le système organise l’accès au temps processeur (ordonnancement) quand plusieurs applications le réclament."}, "24": {"r": "AB", "e": "On vérifie d’abord la connexion, l’alimentation, la reconnaissance par le système et le pilote adapté."}, "25": {"r": "E", "e": "Saisir son nom au clavier est une entrée d’information."}, "26": {"r": "BD", "e": "Afficher un résultat à l’écran et diffuser un son sont des sorties. Numériser, saisir et déplacer la souris sont des entrées."}, "27": {"r": "ACE", "e": "Enregistrer demande une écriture, le système intervient dans l’accès au stockage et le système de fichiers organise le rapport. La RAM ne devient pas permanente."}, "28": {"r": "BD", "e": "Il faut distinguer l’imprimante (ressource matérielle) et les ressources locales qui préparent et transmettent les travaux."}, "29": {"r": "C", "e": "Réserver de la mémoire pour une application lancée est une attribution de ressource."}, "30": {"r": "D", "e": "Rendre réutilisable la mémoire libérée par une application est une récupération de ressource."}, "31": {"r": "F", "e": "Un dossier n’exécute rien, l’extension ne garantit pas le contenu, déplacer un fichier n’augmente pas la RAM, deux fichiers de même nom peuvent différer, et supprimer un raccourci ne supprime pas la cible."}, "32": {"r": "C", "e": "Le système de fichiers organise le stockage et l’accès aux fichiers."}, "33": {"r": "D", "e": "Pour regrouper les documents par UE, on crée une organisation de dossiers correspondante."}, "34": {"r": "F", "e": "Monolithique, en couches, micronoyau et hybride sont des architectures logicielles du système : aucune des descriptions proposées n’est correcte."}, "35": {"r": "AD", "e": "Dans une architecture monolithique, de nombreux services s’exécutent dans l’espace du noyau et ses composants interagissent étroitement."}, "36": {"r": "BCE", "e": "Le micronoyau garde peu de fonctions essentielles, place certains services hors du noyau et repose sur la communication entre composants."}, "37": {"r": "AD", "e": "L’architecture en couches organise le système en niveaux de responsabilité, chaque couche s’appuyant sur les niveaux inférieurs."}, "38": {"r": "BCE", "e": "On compare les architectures par l’organisation des services, la répartition des fonctions entre noyau et autres composants, la modularité et les échanges."}, "39": {"r": "A", "e": "Le noyau assure les fonctions centrales, l’interface permet l’interaction avec l’utilisateur."}, "40": {"r": "BD", "e": "Sans bureau graphique, un système peut fonctionner en ligne de commande et reste un système d’exploitation avec son noyau."}, "41": {"r": "AC", "e": "Des services communs évitent à chaque application de gérer tous les détails matériels et offrent un accès cohérent aux ressources. Ils ne suppriment pas la compatibilité ni les besoins propres à chaque logiciel."}, "42": {"r": "BDE", "e": "La saisie mobilise une entrée, l’affichage une sortie et l’enregistrement un service d’accès au stockage. Le clavier et l’écran ne conservent pas le fichier."}, "43": {"r": "A", "e": "L’abstraction matérielle présente des services utilisables sans exposer tous les détails du matériel."}, "44": {"r": "BC", "e": "L’application demande la lecture sans gérer les détails du périphérique, et le système participe à la demande. La lecture ne garantit pas l’exactitude du contenu."}, "45": {"r": "E", "e": "Une carte réseau est une ressource matérielle de communication."}, "46": {"r": "AC", "e": "La présence physique ne suffit pas : on vérifie la détection du matériel et le pilote."}, "47": {"r": "BE", "e": "En première analyse, on examine l’activité du stockage et la connexion de la clé, et on regarde si d’autres opérations sollicitent les mêmes ressources."}, "48": {"r": "ACD", "e": "La lecture d’une vidéo locale mobilise le stockage, la mémoire vive et le processeur. Ni scanner ni imprimante."}, "49": {"r": "BE", "e": "Le blocage d’une application ne signifie pas une panne générale : le système continue de servir les autres applications."}, "50": {"r": "CD", "e": "Les besoins mémoire dépendent des traitements et des données, et le système tient compte de la mémoire disponible."}, "51": {"r": "ABE", "e": "On identifie le nom du système, sa version et l’architecture prise en charge (par exemple 64 bits). Le mobilier et le sujet imprimé n’ont aucun rapport."}, "52": {"r": "CD", "e": "La présentation peut varier indépendamment des fonctions de gestion, et plusieurs systèmes gèrent le processeur, la mémoire et les fichiers."}, "53": {"r": "AE", "e": "Déplacer un fichier change son emplacement logique et le système de fichiers intervient. Le fichier n’est ni exécuté ni réécrit et la capacité ne change pas."}, "54": {"r": "BD", "e": "Renommer ne convertit pas le format réel, mais l’extension peut influencer le logiciel choisi pour ouvrir le fichier."}, "55": {"r": "A", "e": "Plusieurs applications qui demandent en même temps un périphérique non partageable illustrent un conflit sur une ressource limitée."}, "56": {"r": "DE", "e": "On vérifie la compatibilité avec le système et l’architecture, et on compare les ressources disponibles aux besoins annoncés."}, "57": {"r": "A", "e": "Une analyse rigoureuse observe les symptômes et les ressources sollicitées avant de conclure."}, "58": {"r": "E", "e": "Fermer une fenêtre ne dit pas tout de l’état du programme : un processus peut continuer en arrière-plan et des données peuvent ne pas être enregistrées."}, "59": {"r": "D", "e": "La mémoire est une ressource et un composant du système organise son attribution."}, "60": {"r": "AE", "e": "Le système coordonne les ressources et fournit des services aux applications, et comprendre le rôle des composants aide à analyser le fonctionnement global."}, "61": {"r": "F", "e": "Un processus est un programme en cours d’exécution : aucune des définitions proposées (fichier jamais exécuté, périphérique, icône, unité de RAM, dossiers) n’est correcte."}, "62": {"r": "BDE", "e": "Le contexte d’un processus comprend ses ressources mémoire, son activité courante et les informations pour reprendre son exécution."}, "63": {"r": "F", "e": "Lancer une application ne garantit ni temps processeur illimité, ni toute la mémoire, ni l’arrêt des autres applications, ni suppression de fichiers, ni cœur supplémentaire."}, "64": {"r": "CDE", "e": "Prêt : peut s’exécuter dès qu’il obtient le processeur. En exécution : instructions exécutées. En attente : attend un événement."}, "65": {"r": "AB", "e": "Un programme contient des instructions enregistrées, un processus en est une instance en cours d’exécution."}, "66": {"r": "E", "e": "Deux instances peuvent exécuter le même code avec des données d’exécution distinctes."}, "67": {"r": "B", "e": "La planification organise l’attribution du temps processeur aux processus prêts."}, "68": {"r": "AE", "e": "Préparer un processus, c’est lui attribuer les ressources de démarrage et préparer son contexte d’exécution."}, "69": {"r": "D", "e": "Un processus prêt attend que le système lui attribue du temps processeur."}, "70": {"r": "F", "e": "Un processus en attente peut redevenir prêt, n’est pas terminé, ne libère pas forcément sa mémoire, ne bloque pas les autres et n’occupe pas le processeur pendant l’attente."}, "71": {"r": "ABC", "e": "Sur un seul cœur, le système alterne l’accès au processeur : la concurrence n’exige pas la simultanéité, et un processus progresse pendant qu’un autre attend."}, "72": {"r": "E", "e": "Pendant l’attente d’une lecture, le système exécute un autre processus prêt."}, "73": {"r": "D", "e": "Une reprise d’exécution repart du contexte conservé."}, "74": {"r": "BC", "e": "Il faut conserver l’état d’exécution et la position où reprendre."}, "75": {"r": "AD", "e": "À la fin d’un processus, ses ressources libérables sont récupérées et il n’a plus d’instructions à exécuter."}, "76": {"r": "CE", "e": "Un thread est une unité d’exécution d’un processus et plusieurs threads d’un même processus peuvent partager des données."}, "77": {"r": "D", "e": "Un processus porte les ressources d’exécution et peut contenir plusieurs threads."}, "78": {"r": "CE", "e": "Chaque thread a sa propre progression dans les instructions et son contexte d’exécution."}, "79": {"r": "AB", "e": "Séparer calcul et interface répartit les activités et peut garder l’interface réactive, sans garantie d’accélération."}, "80": {"r": "CD", "e": "La concurrence peut se faire par alternance, le parallélisme par exécution simultanée sur plusieurs unités de calcul."}, "81": {"r": "B", "e": "Sur un seul cœur, deux threads progressent par alternance, sans exécution simultanée de leurs instructions sur ce cœur."}, "82": {"r": "ACD", "e": "Le gain dépend de tâches indépendantes, d’unités de calcul disponibles et d’un coût de coordination limité."}, "83": {"r": "E", "e": "La synchronisation coordonne les tâches et leurs accès aux ressources partagées."}, "84": {"r": "AB", "e": "Avec une variable partagée, l’entrelacement des opérations peut changer le résultat, et chaque mise à jour doit être coordonnée."}, "85": {"r": "E", "e": "Les deux threads lisent 0, ajoutent 1 et écrivent 1 : une mise à jour est perdue, la valeur finale est 1."}, "86": {"r": "BD", "e": "Une augmentation a été perdue : deux écritures identiques ont remplacé deux augmentations successives. Un cœur de plus ne corrige rien."}, "87": {"r": "ACE", "e": "On identifie la séquence lire-modifier-écrire, on coordonne son accès et on vérifie le résultat. Une exécution correcte ne prouve pas l’absence de défaut."}, "88": {"r": "BD", "e": "Sans coordination, une mise à jour peut en remplacer une autre et le résultat dépend de l’entrelacement."}, "89": {"r": "C", "e": "Des lectures seules d’une valeur inchangée ne créent pas de conflit d’écriture."}, "90": {"r": "D", "e": "La tâche B doit attendre que le résultat de A soit disponible : c’est une dépendance."}, "91": {"r": "F", "e": "La synchronisation ne garantit pas d’accélération, n’impose pas de fin simultanée, n’empêche pas l’attente, ne rend pas les données indépendantes et ne dispense pas de vérifier les résultats."}, "92": {"r": "C", "e": "Une portion de code qui manipule une ressource partagée et dont l’accès doit être contrôlé est une section critique."}, "93": {"r": "D", "e": "Une règle d’exclusion mutuelle : un seul thread à la fois dans la portion à protéger."}, "94": {"r": "F", "e": "Aucune de ces observations ne prouve l’absence de problème : une exécution correcte peut être un hasard d’entrelacement."}, "95": {"r": "AD", "e": "Des données distinctes et indépendantes ne créent pas de conflit, mais il faut examiner le partage d’autres ressources."}, "96": {"r": "BCE", "e": "La gestion de la mémoire suit les espaces libres et utilisés, les attribue et récupère ceux qui peuvent l’être. Elle ne garantit pas que toute demande réussisse."}, "97": {"r": "AD", "e": "Les besoins mémoire évoluent et dépendent du programme et des données traitées."}, "98": {"r": "BCE", "e": "Le contrôle d’accès limite les accès non autorisés, protège les données des autres processus et contribue à la stabilité."}, "99": {"r": "A", "e": "Si la demande échoue, l’application doit gérer cet échec."}, "100": {"r": "BD", "e": "On libère l’espace selon les mécanismes de l’environnement et on évite de l’utiliser après sa libération."}, "101": {"r": "AC", "e": "Conserver des espaces inutiles gaspille des ressources et réduit la mémoire disponible pour d’autres besoins."}, "102": {"r": "BDE", "e": "Après libération, l’espace est réutilisable et ne doit plus être utilisé par le programme ; la RAM physique ne change pas."}, "103": {"r": "A", "e": "3 Go + 2 Go = 5 Go, supérieur aux 4 Go disponibles : les deux demandes ne peuvent pas être satisfaites ensemble."}, "104": {"r": "BC", "e": "Une écriture d’un thread peut être visible par un autre, et des modifications mal coordonnées altèrent la cohérence."}, "105": {"r": "E", "e": "La planification organise l’accès au processeur, la gestion mémoire l’attribution des espaces mémoire."}, "106": {"r": "AC", "e": "On mesure l’utilisation du processeur et la durée du travail."}, "107": {"r": "BE", "e": "Pour comparer, on garde des charges comparables et les mêmes données d’entrée."}, "108": {"r": "ACD", "e": "Il faut vérifier l’exactitude du résultat, décrire l’environnement et indiquer le nombre de threads."}, "109": {"r": "BE", "e": "Les coûts de création et de coordination, ou des attentes imposées par les dépendances, peuvent annuler les gains."}, "110": {"r": "CD", "e": "Un faible usage du processeur avec une longue durée suggère des attentes : on examine les ressources attendues et les périodes d’attente entre threads."}, "111": {"r": "ABE", "e": "Plus de threads se mesure sans garantie, ne supprime pas les dépendances et peut augmenter les coûts de gestion."}, "112": {"r": "CD", "e": "Le gain est de 4 secondes et le rapport 12/8 = 1,5. La durée a baissé d’environ 33 % et non de 50 %."}, "113": {"r": "AE", "e": "La moyenne est (9 + 10 + 11) / 3 = 10 s et les essais varient. Un seul essai ne garantit pas les suivants."}, "114": {"r": "BD", "e": "La correction du résultat prime : un résultat erroné ne peut pas être validé par sa rapidité."}, "115": {"r": "A", "e": "Cette seule observation indique une forte activité processeur sur la période, rien de plus."}, "116": {"r": "DE", "e": "Une attente peut respecter une dépendance, et les threads n’ont pas la même activité au même instant."}, "117": {"r": "A", "e": "On mesure et on identifie la ressource ou l’attente limitante avant de modifier."}, "118": {"r": "E", "e": "4 × 250 = 1 000 si toutes les augmentations sont coordonnées."}, "119": {"r": "D", "e": "Un résultat correct avec des mesures dans des conditions comparables."}, "120": {"r": "AE", "e": "La planification organise la progression des tâches, et synchronisation et gestion mémoire permettent une utilisation cohérente des ressources."}, "121": {"r": "F", "e": "Aucune proposition n’est un système de fichiers : processeur, câble, RAM, navigateur et écran sont du matériel ou une application. FAT32, NTFS ou ext4 en seraient."}, "122": {"r": "BDE", "e": "Un système de fichiers organise les fichiers, permet de les retrouver et leur associe des informations descriptives (métadonnées)."}, "123": {"r": "F", "e": "Une partition n’impose pas d’extension, n’a pas de système de fichiers tant qu’elle n’est pas formatée, n’est pas une sauvegarde, n’exige pas un disque distinct et n’augmente pas la capacité."}, "124": {"r": "CDE", "e": "FAT32, NTFS et ext4 sont des systèmes de fichiers."}, "125": {"r": "AB", "e": "Un disque peut contenir plusieurs partitions, chacune étant une région délimitée du disque."}, "126": {"r": "E", "e": "Le formatage crée les structures du système de fichiers dans une partition."}, "127": {"r": "B", "e": "Le partitionnement définit des régions distinctes sur un disque."}, "128": {"r": "AE", "e": "Le formatage établit les structures du système de fichiers et peut rendre les anciennes données inaccessibles par les moyens habituels."}, "129": {"r": "D", "e": "On formate la partition avec un système de fichiers adapté."}, "130": {"r": "F", "e": "FAT32 n’offre pas les permissions NTFS, n’est pas limité au texte, ne signifie pas 32 partitions, limite un fichier à moins de 4 Gio et n’impose pas de taille fixe."}, "131": {"r": "ABC", "e": "FAT32 est reconnu par de nombreux équipements, limite un fichier à 4 Gio moins un octet et n’a pas les permissions par fichier de NTFS."}, "132": {"r": "E", "e": "Les 20 Gio libres suffisent : l’échec vient de la limite de taille par fichier de FAT32 (moins de 4 Gio)."}, "133": {"r": "D", "e": "NTFS permet des autorisations détaillées sur fichiers et dossiers."}, "134": {"r": "BC", "e": "NTFS accepte les fichiers de plus de 4 Gio et gère les permissions."}, "135": {"r": "AD", "e": "ext4 est courant sous Linux et prend en charge propriétaires et permissions."}, "136": {"r": "CE", "e": "On choisit selon les besoins de taille et de contrôle d’accès, et la compatibilité avec les systèmes et équipements visés."}, "137": {"r": "D", "e": "10 Gio par fichier et autorisations par utilisateur : NTFS."}, "138": {"r": "CE", "e": "Un fichier de 6 Gio dépasse la limite de FAT32 et la compatibilité de l’appareil doit être prise en compte."}, "139": {"r": "AB", "e": "La journalisation aide à retrouver une structure cohérente après interruption, mais ne remplace pas une sauvegarde."}, "140": {"r": "CD", "e": "Deux partitions peuvent avoir des systèmes de fichiers différents et leur capacité totale reste limitée par celle du disque."}, "141": {"r": "B", "e": "500 − (120 + 280) = 100 Go non alloués."}, "142": {"r": "ACD", "e": "Sauvegarder, identifier précisément le disque et la partition, vérifier l’espace et les conséquences."}, "143": {"r": "E", "e": "Supprimer une partition rend ses fichiers inaccessibles : opération à risque."}, "144": {"r": "AB", "e": "Avant de redimensionner : limites de l’outil et espace libre ou non alloué disponible."}, "145": {"r": "E", "e": "Deux partitions d’un même disque ne protègent pas d’une panne complète de ce disque."}, "146": {"r": "BD", "e": "L’espace non alloué n’appartient à aucune partition et peut servir à en créer une."}, "147": {"r": "ACE", "e": "Une arborescence est hiérarchique, un chemin désigne un emplacement et des fichiers de même nom peuvent exister dans des dossiers différents."}, "148": {"r": "BD", "e": "Un fichier contient des données ou des instructions, un dossier organise des entrées (fichiers et sous-dossiers)."}, "149": {"r": "C", "e": "Un chemin absolu part de la racine /."}, "150": {"r": "D", "e": "Un chemin relatif est interprété à partir du répertoire courant."}, "151": {"r": "F", "e": "Changer l’extension ne convertit pas le format, renommer ne déplace pas sur une autre partition, un nom long n’augmente pas la capacité, le nom ne détermine pas les permissions et deux fichiers de même nom peuvent différer."}, "152": {"r": "C", "e": "Sous ext4, la casse compte : Rapport.txt et rapport.txt peuvent être deux fichiers distincts."}, "153": {"r": "D", "e": "Les métadonnées décrivent le fichier : taille, dates, permissions…"}, "154": {"r": "F", "e": "Un fichier sans droit d’écriture ne disparaît pas, lire ne donne pas le droit de modifier, le droit x n’impose pas qu’il soit un programme valide, les droits varient selon les utilisateurs et la visibilité n’est pas la modification."}, "155": {"r": "AD", "e": "Les permissions limitent les accès par utilisateur ou groupe et définissent les opérations autorisées."}, "156": {"r": "BCE", "e": "Le modèle classique distingue le propriétaire, le groupe et les autres utilisateurs."}, "157": {"r": "AD", "e": "r autorise la lecture du contenu et w sa modification."}, "158": {"r": "BCE", "e": "Le droit x autorise une tentative d’exécution sans garantir qu’elle réussisse, et n’accorde pas le droit de modifier."}, "159": {"r": "A", "e": "Pour un dossier, x permet de le traverser pour accéder à des entrées dont on connaît le nom, sous réserve des autres droits."}, "160": {"r": "BD", "e": "r = 4, w = 2, x = 1."}, "161": {"r": "AC", "e": "Valeurs : r = 4, w = 2, x = 1. Donc 5 = r-x et 7 = rwx. 4 = r-- (pas -w-), 0 = --- et 6 = rw-."}, "162": {"r": "BDE", "e": "rw-r----- : le propriétaire lit et modifie, le groupe lit seulement, les autres n’ont aucun droit, et personne n’a x."}, "163": {"r": "A", "e": "rw- = 6, r-- = 4, --- = 0 : 640."}, "164": {"r": "BC", "e": "754 : propriétaire rwx, groupe r-x, autres r--. Les autres ne peuvent pas exécuter et le groupe ne peut pas modifier."}, "165": {"r": "E", "e": "Propriétaire rw- (6), groupe --- (0), autres --- (0) : 600."}, "166": {"r": "AC", "e": "644 : le propriétaire lit et écrit (rw-), le groupe et les autres lisent (r--), personne n’exécute."}, "167": {"r": "BE", "e": "On consulte les permissions avec les propriétés du gestionnaire de fichiers ou avec ls -l."}, "168": {"r": "ACD", "e": "600 : seul le propriétaire lit et modifie, sans aucun droit pour le groupe ni les autres."}, "169": {"r": "BE", "e": "Les autorisations NTFS peuvent être attribuées à des utilisateurs et à des groupes."}, "170": {"r": "CD", "e": "Les fichiers et sous-dossiers peuvent hériter des autorisations du dossier parent, et l’analyse des droits doit en tenir compte."}, "171": {"r": "ABE", "e": "Lecture pour les étudiants, modification pour les enseignants, et vérification des droits effectifs avec des comptes représentatifs."}, "172": {"r": "CD", "e": "Il peut manquer le droit d’écriture ou le volume être en lecture seule. Lire ne garantit pas d’écrire."}, "173": {"r": "AE", "e": "chmod 777 accorde des droits très larges : on cherche d’abord les droits nécessaires avant de généraliser."}, "174": {"r": "BD", "e": "750 = rwx pour le propriétaire, r-x pour le groupe, rien pour les autres. Le groupe ne peut pas créer d’entrées sans w."}, "175": {"r": "A", "e": "444 : lecture seule pour tous, sans écriture."}, "176": {"r": "DE", "e": "On contrôle les droits sur l’objet et sur les dossiers du chemin, et on teste avec les catégories d’utilisateurs concernées."}, "177": {"r": "A", "e": "Il faut vérifier les droits de traversée (x) sur les dossiers du chemin."}, "178": {"r": "E", "e": "Sous Linux, supprimer un fichier dépend des droits sur le dossier parent, pas du droit d’écriture sur le fichier."}, "179": {"r": "D", "e": "FAT32 n’offre pas le modèle d’autorisations par fichier de NTFS."}, "180": {"r": "AE", "e": "Choisir le système de fichiers selon besoins et compatibilité, et vérifier permissions et sauvegardes avant les opérations."}, "181": {"r": "F", "e": "Aucune proposition n’est un logiciel serveur web : câble, dossier, adresse IP, RAM et souris ne le sont pas. Apache ou Nginx en seraient."}, "182": {"r": "BDE", "e": "Apache reçoit des requêtes HTTP, sert des fichiers web selon sa configuration et applique des règles d’accès aux ressources publiées."}, "183": {"r": "F", "e": "L’installation ne garantit ni protection définitive, ni publication des fichiers personnels, ni ouverture du pare-feu, ni accès Internet, ni enregistrement de domaines."}, "184": {"r": "CDE", "e": "Le navigateur est un client HTTP, Apache un serveur, et le client demande une ressource à laquelle le serveur répond."}, "185": {"r": "AB", "e": "Un site local se teste sur la machine qui exécute Apache, sans Internet ni domaine public."}, "186": {"r": "E", "e": "Une requête vers http://localhost/ utilise HTTP."}, "187": {"r": "B", "e": "Le port par défaut de HTTP est 80."}, "188": {"r": "AE", "e": "Apache fonctionne sous Windows et Linux, avec des chemins et outils de gestion qui varient."}, "189": {"r": "D", "e": "On identifie le système, les droits nécessaires et la méthode d’installation adaptée."}, "190": {"r": "F", "e": "Un dossier, un paquet téléchargé, un éditeur, une configuration non testée ou un raccourci ne prouvent pas qu’Apache répond : il faut tester une requête."}, "191": {"r": "ABC", "e": "On vérifie que le service est démarré, qu’il écoute sur l’adresse et le port attendus, et on fait une requête de test."}, "192": {"r": "E", "e": "httpd -t vérifie la syntaxe de la configuration."}, "193": {"r": "D", "e": "apachectl configtest teste la configuration."}, "194": {"r": "BC", "e": "La validation repère certaines erreurs avant application des changements mais ne remplace pas les tests fonctionnels."}, "195": {"r": "AD", "e": "On conserve une copie de la configuration et on identifie les fichiers réellement chargés."}, "196": {"r": "CE", "e": "DocumentRoot désigne le répertoire de base des documents du site, et chaque hôte virtuel peut avoir le sien."}, "197": {"r": "D", "e": "Sans Alias ni réécriture, /index.html correspond à /var/www/cours/index.html."}, "198": {"r": "CE", "e": "DirectoryIndex définit les noms de fichiers recherchés pour un répertoire, et ne marche que si ces fichiers existent."}, "199": {"r": "AB", "e": "On vérifie que le répertoire existe et que le compte qui exécute Apache peut lire les fichiers."}, "200": {"r": "CD", "e": "Listen définit adresses et ports d’écoute, qui doivent être cohérents avec les URL de test."}, "201": {"r": "B", "e": "Pour viser le port 8080 en HTTP : http://localhost:8080/."}, "202": {"r": "ACD", "e": "On teste la syntaxe, on applique le changement par l’action de gestion adaptée (rechargement ou redémarrage) puis on teste la réponse HTTP et les journaux. Enregistrer le fichier ne change pas le service actif."}, "203": {"r": "E", "e": "Un hôte virtuel permet d’héberger plusieurs sites sur un même serveur."}, "204": {"r": "AB", "e": "Avec les hôtes virtuels par nom, le nom demandé sélectionne le site et plusieurs sites peuvent partager une même adresse IP."}, "205": {"r": "E", "e": "ServerName indique le nom principal de l’hôte virtuel."}, "206": {"r": "BD", "e": "ServerAlias ajoute des noms associés au même hôte, qui doivent aussi atteindre le serveur par une résolution adaptée."}, "207": {"r": "ACE", "e": "Il faut deux hôtes virtuels différenciés, les contenus et chemins correspondants, et la résolution des deux noms vers le serveur."}, "208": {"r": "BD", "e": "Le fichier hosts associe localement un nom à une adresse IP, sur ce poste seulement."}, "209": {"r": "C", "e": "Dans un navigateur, localhost désigne le poste lui-même."}, "210": {"r": "D", "e": "Depuis un autre poste, on utilise l’adresse du serveur : http://192.168.10.20/."}, "211": {"r": "F", "e": "Un VirtualHost ne s’enregistre pas dans le DNS, ne garantit pas l’accès depuis Internet, ne se sélectionne pas par le nom du dossier, peut partager un port avec d’autres hôtes et ne crée pas de machine virtuelle."}, "212": {"r": "C", "e": "Le premier hôte virtuel déclaré pour cette adresse et ce port sert d’hôte par défaut."}, "213": {"r": "D", "e": "httpd -S affiche la configuration des hôtes virtuels."}, "214": {"r": "F", "e": "Aucune de ces actions ne publie deux sites : il faut une configuration d’hôtes virtuels, des contenus et une résolution des noms."}, "215": {"r": "AD", "e": "On vérifie quel hôte est sélectionné pour chaque nom et on compare ServerName et DocumentRoot."}, "216": {"r": "BCE", "e": "Si l’accès par IP marche mais pas par le nom : nom présent dans la bonne configuration, résolution sur le client et correspondance exacte avec le nom configuré."}, "217": {"r": "AD", "e": "Déclarer *:8080 ne crée pas l’écoute : la configuration Listen doit être cohérente avec le port voulu."}, "218": {"r": "BCE", "e": "On vérifie l’écoute, le pare-feu et la connectivité, et que le client utilise l’adresse du serveur et non son propre localhost."}, "219": {"r": "A", "e": "Si un autre service occupe l’adresse et le port, Apache peut échouer à démarrer avec une erreur de liaison."}, "220": {"r": "BD", "e": "ErrorLog désigne la destination des erreurs, CustomLog définit la journalisation des requêtes selon un format."}, "221": {"r": "AC", "e": "Noter le nom demandé et l’heure des tests, et prévoir des journaux identifiables pour ce site."}, "222": {"r": "BDE", "e": "Un 404 vient d’un serveur HTTP qui a répondu : la ressource demandée n’a pas été trouvée, il faut vérifier chemin et site sélectionné."}, "223": {"r": "A", "e": "Un 403 signale un accès refusé : on examine règles d’accès Apache, permissions et journaux."}, "224": {"r": "BC", "e": "On teste la syntaxe et on consulte les messages d’erreur et journaux de démarrage."}, "225": {"r": "E", "e": "La modification des fichiers de configuration doit être limitée aux comptes autorisés."}, "226": {"r": "AC", "e": "On retire du répertoire public configuration et fichiers sensibles et on ne publie que le nécessaire."}, "227": {"r": "BE", "e": "Le compte d’Apache doit pouvoir lire ce qu’il publie, sans droits d’écriture inutiles (moindre privilège)."}, "228": {"r": "ACD", "e": "Source fiable, maintien à jour et documentation adaptée à l’environnement."}, "229": {"r": "BE", "e": "Require all denied peut interdire l’accès et Require all granted l’autoriser, au niveau d’Apache et dans le contexte où la règle s’applique."}, "230": {"r": "CD", "e": "L’autorisation Apache ne remplace pas les permissions du système : les droits du compte de service doivent aussi être examinés."}, "231": {"r": "ABE", "e": "Options -Indexes retire l’affichage automatique de la liste des fichiers sans interdire l’accès à un fichier dont l’URL est connue."}, "232": {"r": "CD", "e": "Une page affichée confirme cette requête dans ces conditions : les autres hôtes et règles d’accès demandent leurs propres tests."}, "233": {"r": "AE", "e": "Une sauvegarde de configuration dans DocumentRoot peut être téléchargée et révéler des informations qui ne doivent pas être publiées."}, "234": {"r": "BD", "e": "On teste une requête qui doit être refusée et on vérifie que les ressources publiques restent accessibles."}, "235": {"r": "A", "e": "Le pare-feu peut autoriser ou bloquer le trafic vers le port d’Apache."}, "236": {"r": "DE", "e": "On limite les changements au périmètre prévu et on conserve de quoi rétablir l’état initial."}, "237": {"r": "A", "e": "Un test HTTP consiste à demander la page par une URL http://... dans un navigateur."}, "238": {"r": "E", "e": "Avec DirectoryIndex accueil.html, la ressource recherchée pour / est accueil.html."}, "239": {"r": "D", "e": "Chaque nom prévu doit afficher son contenu propre et les accès doivent être testés selon les règles attendues."}, "240": {"r": "AE", "e": "L’écoute, les noms et les répertoires doivent être cohérents, et la validation syntaxique doit être complétée par des tests HTTP et d’accès."}};
const KEY = 'qcm-sysc-v1', AKEY = 'qcm-sysc-answers-v1';

function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let progress = load(KEY, {});            // id -> {box, last, n}
let answers = Object.assign({}, ANSWERS_BUILTIN, load(AKEY, {})); // id -> {r:"B", e:"..."}
let queue = [], idx = 0, session = {ok:0, ko:0}, current = null, picked = new Set(), locked = false;

const $ = id => document.getElementById(id);
const hasAns = q => answers[q.id] && answers[q.id].r;

function init(){
  const sel = $('mod');
  sel.innerHTML = '<option value="0">Toutes les semaines</option>' +
    DATA.modules.map(m => `<option value="${m.id}">Semaine ${m.id} – ${m.titre}</option>`).join('');
  refresh();
}
function refresh(){
  const total = DATA.questions.length, withAns = DATA.questions.filter(hasAns).length;
  $('sub').textContent = withAns + ' questions avec corrigé sur ' + total;
  const ids = DATA.questions.filter(hasAns).map(q => q.id);
  let seen=0, ok=0, ko=0;
  ids.forEach(id => { const p = progress[id]; if(p){ seen++; if(p.last) { if((p.box||1)>=3) ok++; } else ko++; } });
  $('sSeen').textContent = seen; $('sOk').textContent = ok; $('sKo').textContent = ko;
  $('barfill').style.width = ids.length ? Math.round(100*ok/ids.length)+'%' : '0';
}

function pool(){
  const m = +$('mod').value, mode = $('mode').value;
  let qs = DATA.questions.filter(q => hasAns(q) && (!m || q.module === m));
  if(mode === 'new') qs = qs.filter(q => !progress[q.id]);
  if(mode === 'wrong') qs = qs.filter(q => progress[q.id] && !progress[q.id].last);
  return qs;
}
function weight(q){ const p = progress[q.id]; return p ? Math.max(1, 6 - (p.box||1)) * (p.last ? 1 : 2) : 4; }
function buildQueue(qs, mode){
  if(mode === 'all') return qs.slice();
  const a = qs.slice(), out = [];
  while(a.length){
    const tot = a.reduce((s,q) => s + weight(q), 0); let r = Math.random() * tot, i = 0;
    for(; i < a.length; i++){ r -= weight(a[i]); if(r <= 0) break; }
    out.push(a.splice(Math.min(i, a.length-1), 1)[0]);
  }
  return out;
}

function start(){
  const qs = pool();
  if(!qs.length){
    alert(Object.keys(answers).length ? 'Aucune question ne correspond à ce filtre.' : 'Pas encore de corrigé : importe un fichier JSON de réponses.');
    return;
  }
  queue = buildQueue(qs, $('mode').value).slice(0, 50 > qs.length ? qs.length : 50);
  if($('mode').value === 'all') queue = qs.slice();
  idx = 0; session = {ok:0, ko:0};
  $('setup').classList.add('hide'); $('quiz').classList.remove('hide');
  show();
}

function show(){
  current = queue[idx]; picked = new Set(); locked = false;
  const a = answers[current.id].r, multi = !!current.multi || a.length > 1;
  const mod = DATA.modules.find(m => m.id === current.module);
  $('qmeta').textContent = 'Semaine ' + current.module + ' · Q' + current.num;
  $('qcount').textContent = (idx+1) + ' / ' + queue.length + ' · ✓ ' + session.ok + ' ✗ ' + session.ko;
  $('qtext').textContent = current.question + (current.multi ? ' (une, plusieurs ou aucune réponse correcte)' : (multi ? ' (' + a.length + ' réponses)' : ''));
  $('opts').innerHTML = '';
  Object.entries(current.choix).forEach(([k, t]) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.dataset.k = k;
    b.innerHTML = '<b>' + k + ')</b><span></span>'; b.lastChild.textContent = t;
    b.onclick = () => choose(k, multi);
    $('opts').appendChild(b);
  });
  $('validate').classList.toggle('hide', !multi);
  $('validate').disabled = true;
  $('result').innerHTML = '';
  $('next').disabled = true;
  $('next').textContent = idx === queue.length - 1 ? 'Voir le score' : 'Suivante';
}

function choose(k, multi){
  if(locked) return;
  if(!multi){ picked = new Set([k]); grade(); return; }
  if(k === 'F'){ picked = picked.has('F') ? new Set() : new Set(['F']); } else { picked.delete('F'); picked.has(k) ? picked.delete(k) : picked.add(k); }
  document.querySelectorAll('.opt').forEach(b => b.classList.toggle('sel', picked.has(b.dataset.k)));
  $('validate').disabled = picked.size === 0;
}

function grade(){
  locked = true;
  const good = new Set(answers[current.id].r.split(''));
  const okAll = good.size === picked.size && [...good].every(x => picked.has(x));
  document.querySelectorAll('.opt').forEach(b => {
    b.classList.remove('sel');
    if(good.has(b.dataset.k)) b.classList.add('ok');
    else if(picked.has(b.dataset.k)) b.classList.add('ko');
  });
  const p = progress[current.id] || {box:1, n:0};
  p.n++; p.last = okAll; p.box = okAll ? Math.min(5, (p.box||1)+1) : 1;
  progress[current.id] = p; save(KEY, progress);
  okAll ? session.ok++ : session.ko++;
  const e = answers[current.id].e;
  const r = $('result'); r.innerHTML = '';
  const v = document.createElement('div'); v.className = 'verdict ' + (okAll ? 'ok' : 'ko');
  v.textContent = okAll ? '✓ Correct' : '✗ Incorrect – bonne réponse : ' + [...good].map(x => x === 'F' ? 'Aucune (F)' : x).join(', ');
  r.appendChild(v);
  if(e){ const d = document.createElement('div'); d.className = 'expl'; d.textContent = e; r.appendChild(d); }
  if(answers[current.id].d){ const w = document.createElement('div'); w.className = 'expl doubt'; w.textContent = '⚠ Réponse à vérifier dans ton cours : le corrigé généré présente ici un doute.'; r.appendChild(w); }
  $('validate').classList.add('hide');
  $('next').disabled = false;
  $('qcount').textContent = (idx+1) + ' / ' + queue.length + ' · ✓ ' + session.ok + ' ✗ ' + session.ko;
  refresh();
}

function next(){
  if(idx < queue.length - 1){ idx++; show(); return; }
  end();
}
function end(){
  $('quiz').classList.add('hide'); $('setup').classList.remove('hide');
  const done = session.ok + session.ko;
  if(done) alert('Session terminée : ' + session.ok + ' / ' + done + ' (' + Math.round(100*session.ok/done) + ' %)');
  refresh();
}

$('start').onclick = start;
$('next').onclick = next;
$('stop').onclick = end;
$('validate').onclick = grade;
$('reset').onclick = () => { if(confirm('Effacer toute ta progression ?')){ progress = {}; save(KEY, progress); refresh(); } };
$('imp').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    const j = JSON.parse(await f.text()), norm = {};
    Object.entries(j).forEach(([id, v]) => {
      const r = String(typeof v === 'string' ? v : v.r || v.reponse || '').toUpperCase().replace(/[^A-F]/g,'');
      if(r) norm[id] = {r: [...new Set(r)].sort().join(''), e: (v && (v.e || v.explication)) || '', d: v && v.d ? 1 : 0};
    });
    answers = Object.assign({}, answers, norm); save(AKEY, norm);
    $('impmsg').textContent = Object.keys(norm).length + ' réponses importées.';
    refresh();
  }catch(err){ $('impmsg').textContent = 'Fichier invalide.'; }
};

let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('install').classList.remove('hide'); });
$('install').onclick = async () => { if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(e){} deferredInstall = null; $('install').classList.add('hide'); };
window.addEventListener('appinstalled', () => $('install').classList.add('hide'));
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){ navigator.serviceWorker.register('sw.js').catch(() => {}); }
init();
</script>
